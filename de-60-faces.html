<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prototype dé 60 faces — Pokémon Randomizer</title><style>body{font:16px system-ui;background:#092b48;color:white;max-width:850px;margin:auto;padding:24px}button,select{padding:12px;border-radius:9px;border:0;margin:5px;background:#f4cb56;color:#17243a;font-weight:bold}article{background:#153e60;padding:20px;border-radius:16px;margin:20px 0}li{padding:8px;border-bottom:1px solid #ffffff33}.I{color:#79e7a3}.B{color:#ffd17b}.M{color:#ff9292}a{color:#fff}</style><h1>🎲 Dé Pokémon à 60 faces</h1><p>Prototype indépendant : 36 informations, 16 bonus avec contrepartie, 8 contraintes. Le dé ne révèle aucun Pokémon sans validation du randomiseur.</p><button id="roll">Lancer le dé</button><button id="reset">Réinitialiser les 60 faces</button><article id="result" aria-live="polite">Prêt pour le tirage.</article><section id="choice" hidden><p>Choisis les starters concernés (positions 1, 2 ou 3) :</p><label><input type="checkbox" value="1"> Starter 1</label> <label><input type="checkbox" value="2"> Starter 2</label> <label><input type="checkbox" value="3"> Starter 3</label><p><button id="confirm">Valider le choix</button></p></section><p id="remaining"></p><h2>Liste complète</h2><ol id="list"></ol><p><a href="./">Retour au Randomizer</a></p><script>const faces=[{"n":1,"type":"I","label":"Numéro Pokédex","count":2},{"n":2,"type":"B","label":"Voir les 3 starters — aucun objet","count":0},{"n":3,"type":"I","label":"Cri Pokémon","count":1},{"n":4,"type":"I","label":"Génération","count":3},{"n":5,"type":"B","label":"Voir 2 starters — attaque imposée","count":0},{"n":6,"type":"I","label":"Poids","count":1},{"n":7,"type":"I","label":"BST","count":2},{"n":8,"type":"M","label":"Nature neutre imposée","count":0},{"n":9,"type":"I","label":"Première lettre","count":3},{"n":10,"type":"B","label":"Connaître les 3 types — aucun EV","count":0},{"n":11,"type":"I","label":"Taille","count":2},{"n":12,"type":"I","label":"Groupe d’œufs","count":1},{"n":13,"type":"B","label":"Voir 1 starter — évolution interdite","count":0},{"n":14,"type":"I","label":"Description Pokédex","count":3},{"n":15,"type":"M","label":"Une attaque interdite","count":0},{"n":16,"type":"I","label":"Catégorie d’espèce","count":2},{"n":17,"type":"I","label":"Statistique la plus élevée","count":1},{"n":18,"type":"B","label":"Connaître les 3 movepools — sans objet ni EV","count":0},{"n":19,"type":"I","label":"Nom étranger","count":3},{"n":20,"type":"B","label":"Voir les 3 starters — talent caché interdit","count":0},{"n":21,"type":"I","label":"Numéro Pokédex","count":3},{"n":22,"type":"I","label":"Cri Pokémon","count":1},{"n":23,"type":"M","label":"Aucun objet tenu","count":0},{"n":24,"type":"I","label":"Génération","count":2},{"n":25,"type":"B","label":"Connaître les talents des 3 — talent imposé","count":0},{"n":26,"type":"I","label":"Poids","count":1},{"n":27,"type":"I","label":"BST","count":3},{"n":28,"type":"B","label":"Connaître les BST des 3 — nature imposée","count":0},{"n":29,"type":"I","label":"Première lettre","count":2},{"n":30,"type":"M","label":"Téracristallisation interdite","count":0},{"n":31,"type":"I","label":"Taille","count":1},{"n":32,"type":"I","label":"Groupe d’œufs","count":3},{"n":33,"type":"B","label":"Voir 2 starters — nature imposée","count":0},{"n":34,"type":"I","label":"Description Pokédex","count":2},{"n":35,"type":"B","label":"Connaître les 3 stats maximales — aucun EV dans les quatre catégories","count":0},{"n":36,"type":"I","label":"Catégorie d’espèce","count":1},{"n":37,"type":"I","label":"Statistique la plus élevée","count":3},{"n":38,"type":"M","label":"Évolution interdite","count":0},{"n":39,"type":"I","label":"Nom étranger","count":2},{"n":40,"type":"B","label":"Voir 1 starter — aucun objet","count":0},{"n":41,"type":"I","label":"Numéro Pokédex","count":3},{"n":42,"type":"I","label":"Cri Pokémon","count":2},{"n":43,"type":"B","label":"Noms étrangers des 3 — attaque interdite","count":0},{"n":44,"type":"I","label":"Génération","count":2},{"n":45,"type":"M","label":"Talent imposé parmi les talents disponibles","count":0},{"n":46,"type":"I","label":"Poids","count":3},{"n":47,"type":"I","label":"BST","count":1},{"n":48,"type":"B","label":"Quatre attaques les plus puissantes — une seule attaque STAB","count":0},{"n":49,"type":"I","label":"Première lettre","count":1},{"n":50,"type":"B","label":"Voir les 3 starters — attaque imposée","count":0},{"n":51,"type":"I","label":"Taille","count":3},{"n":52,"type":"I","label":"Groupe d’œufs","count":2},{"n":53,"type":"M","label":"Type Téracristal imposé","count":0},{"n":54,"type":"I","label":"Description Pokédex","count":1},{"n":55,"type":"B","label":"Types, talents et stats — aucun EV dans quatre catégories","count":0},{"n":56,"type":"I","label":"Catégorie d’espèce","count":3},{"n":57,"type":"I","label":"Statistique la plus élevée","count":2},{"n":58,"type":"B","label":"Voir 2 starters — aucun objet","count":0},{"n":59,"type":"I","label":"Nom étranger","count":1},{"n":60,"type":"M","label":"Aucune attaque STAB","count":0}];let remaining=faces.map(x=>x.n),current=null;const result=document.getElementById('result'),choice=document.getElementById('choice'),checks=[...choice.querySelectorAll('input')];function update(){document.getElementById('remaining').textContent=remaining.length+' face(s) encore disponibles';document.getElementById('roll').disabled=remaining.length===0;}document.getElementById('list').innerHTML=faces.map(f=>'<li><b class="'+f.type+'">'+f.n+' ['+f.type+']</b> '+f.label+(f.count?' — '+f.count+' starter(s)':'')+'</li>').join('');document.getElementById('roll').onclick=()=>{if(!remaining.length)return;const ix=Math.floor(Math.random()*remaining.length);const n=remaining.splice(ix,1)[0];current=faces[n-1];checks.forEach(c=>c.checked=false);result.textContent='Face '+n+' : '+current.label+(current.count?' — '+current.count+' starter(s)':'');choice.hidden=current.count===0||current.count===3;update();};document.getElementById('confirm').onclick=()=>{const selected=checks.filter(c=>c.checked).map(c=>c.value);if(selected.length!==current.count){alert('Choisis exactement '+current.count+' starter(s).');return;}result.textContent+=' | Positions choisies : '+selected.join(', ')+'. Le randomiseur doit maintenant révéler uniquement les indices autorisés.';choice.hidden=true;};document.getElementById('reset').onclick=()=>{remaining=faces.map(x=>x.n);current=null;choice.hidden=true;result.textContent='Dé réinitialisé.';update()};update();</script></html>
