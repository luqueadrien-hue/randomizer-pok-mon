<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokémon Randomizer V31</title><style>
*{box-sizing:border-box}body{margin:0;background:#100817;color:#fff;font-family:system-ui,Arial}.wrap{max-width:1050px;margin:auto;padding:22px}.hero,.card{background:#21152c;border:1px solid #5e4772;border-radius:18px;padding:18px;margin:12px 0}.hero{text-align:center}h1,h2{margin:6px 0 14px}.sub,.muted{color:#cbbfd4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,select,button{width:100%;padding:12px;margin:5px 0;border-radius:11px;border:1px solid #76658b;background:#160d20;color:#fff;font-size:16px}button{cursor:pointer;font-weight:800}.primary{background:#e7bd4d;color:#21152c}.danger{background:#51223a}.code{font-size:30px;letter-spacing:4px;text-align:center;color:#f2cf68;font-weight:900}.hidden{display:none}.status{text-align:center}.players{display:flex;flex-wrap:wrap;gap:8px}.pill{padding:8px 12px;background:#332440;border-radius:999px}.box{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.slot{min-height:125px;background:#180f21;border:1px solid #59466c;border-radius:12px;text-align:center;padding:7px}.slot img{width:78px;height:78px;object-fit:contain}.slot.taken{opacity:.28}.slot button{padding:7px;font-size:12px}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.err{color:#ff9da9}.ok{color:#91e6aa}@media(max-width:700px){.grid,.toolbar{grid-template-columns:1fr}.box{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div class="wrap"><div class="hero"><h1>🎲 Pokémon Randomizer</h1><div class="sub">V31 multijoueur — Firebase</div><div id="firebaseStatus" class="muted">Connexion…</div></div>
<section id="home"><div class="grid"><div class="card"><h2>👑 Créer</h2><input id="hostName" placeholder="Pseudo de l'hôte" maxlength="24"><button id="createBtn" class="primary">Créer un salon</button><div id="hostOut"></div></div><div class="card"><h2>🎮 Rejoindre</h2><input id="playerName" placeholder="Ton pseudo" maxlength="24"><input id="roomCode" placeholder="PKMN-1234" maxlength="9"><button id="joinBtn">Rejoindre</button><div id="joinOut" class="status"></div></div></div></section>
<section id="room" class="hidden"><div class="card"><div class="grid"><div><h2 id="roomTitle">Salon</h2><div id="roomCodeBig" class="code"></div></div><div><h2>Joueurs</h2><div id="players" class="players"></div></div></div><button id="leaveBtn" class="danger">Quitter le salon</button></div>
<div id="hostControls" class="card hidden"><h2>🎛️ Contrôle de l'hôte</h2><div class="toolbar"><select id="pool"><option value="1025">National (jusqu'à 1025)</option><option value="151">Kanto</option><option value="251">Johto</option><option value="386">Hoenn</option><option value="493">Sinnoh</option><option value="649">Unys</option><option value="721">Kalos</option><option value="809">Alola</option><option value="898">Galar</option></select><select id="count"><option>6</option><option>12</option><option>18</option><option>24</option><option>30</option></select><button id="generateBtn" class="primary">Générer la Box</button></div><div id="genStatus" class="muted"></div></div>
<div class="card"><h2>📦 BOÎTE 1</h2><div id="box" class="box"></div></div></section></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import{getDatabase,ref,set,get,update,onValue,onDisconnect,remove}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";
const db=getDatabase(initializeApp({apiKey:"AIzaSyB6cWUJru6vpfdpj5aE59jKAXA523Eka1E",authDomain:"pokemon-randomizer-f3b0f.firebaseapp.com",databaseURL:"https://pokemon-randomizer-f3b0f-default-rtdb.firebaseio.com",projectId:"pokemon-randomizer-f3b0f",storageBucket:"pokemon-randomizer-f3b0f.firebasestorage.app",messagingSenderId:"1031451577108",appId:"1:1031451577108:web:428ade1b96ab7e85489001"}));let session=null,unsubRoom=null;
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function msg(id,t,err=false){$(id).innerHTML='<span class="'+(err?'err':'ok')+'">'+esc(t)+'</span>'}
async function probe(){try{await get(ref(db,".info/connected"));$("firebaseStatus").innerHTML='<span class="ok">● Firebase prêt</span>'}catch(e){$("firebaseStatus").innerHTML='<span class="err">● Firebase inaccessible</span>'}}probe();
function code(){return"PKMN-"+Math.floor(1000+Math.random()*9000)}function id(){return crypto.randomUUID().replaceAll("-","").slice(0,12)}
async function enter(s){session=s;localStorage.setItem("pkmn-session",JSON.stringify(s));$("home").classList.add("hidden");$("room").classList.remove("hidden");$("roomCodeBig").textContent=s.room;$("hostControls").classList.toggle("hidden",s.role!=="host");await set(ref(db,"rooms/"+s.room+"/players/"+s.id+"/online"),true);onDisconnect(ref(db,"rooms/"+s.room+"/players/"+s.id+"/online")).set(false);watch();}
function watch(){if(unsubRoom)unsubRoom();unsubRoom=onValue(ref(db,"rooms/"+session.room),snap=>{if(!snap.exists()){leave(false);return}const r=snap.val(), ps=r.players||{};$("players").innerHTML=Object.entries(ps).map(([k,p])=>'<span class="pill">'+(p.role==="host"?"👑 ":"")+esc(p.name)+(p.online===false?" ⚫":" 🟢")+'</span>').join("");renderBox(r.box||{});});}
function renderBox(b){const mons=b.mons||[],$b=$("box");$b.innerHTML="";for(let i=0;i<30;i++){const m=mons[i],d=document.createElement("div");d.className="slot"+(m?.takenBy?" taken":"");if(m)d.innerHTML='<div>#'+(i+1)+'</div><img src="'+m.sprite+'" alt=""><div><b>'+esc(m.name)+'</b></div>'+(m.takenBy?'<small>Choisi</small>':'<button data-i="'+i+'">Choisir</button>');else d.innerHTML='<div>#'+(i+1)+'</div><div class="muted" style="padding-top:42px">Vide</div>'; $b.appendChild(d)}$b.querySelectorAll("button[data-i]").forEach(x=>x.onclick=()=>pick(+x.dataset.i));}
async function pick(i){if(!session)return;const p=ref(db,"rooms/"+session.room+"/box/mons/"+i);const s=await get(p);if(!s.exists()||s.val().takenBy)return;await update(p,{takenBy:session.id,takenName:session.name,takenAt:Date.now()});}
$("createBtn").onclick=async()=>{try{const name=$("hostName").value.trim()||"Hôte";let c,s;do{c=code();s=await get(ref(db,"rooms/"+c))}while(s.exists());const uid=id();await set(ref(db,"rooms/"+c),{created:Date.now(),hostId:uid,status:"lobby",players:{[uid]:{name,role:"host",online:true,joined:Date.now()}}});await enter({room:c,id:uid,name,role:"host"});}catch(e){msg("hostOut","Firebase refuse l'écriture : "+(e.code||e.message),true)}};
$("joinBtn").onclick=async()=>{try{const name=$("playerName").value.trim()||"Joueur",c=$("roomCode").value.trim().toUpperCase();if(!/^PKMN-\d{4}$/.test(c))return msg("joinOut","Code invalide.",true);const s=await get(ref(db,"rooms/"+c));if(!s.exists())return msg("joinOut","Salon introuvable.",true);const uid=id();await set(ref(db,"rooms/"+c+"/players/"+uid),{name,role:"player",online:true,joined:Date.now()});await enter({room:c,id:uid,name,role:"player"});}catch(e){msg("joinOut","Connexion refusée : "+(e.code||e.message),true)}};
$("generateBtn").onclick=async()=>{if(session?.role!=="host")return;try{$("genStatus").textContent="Génération…";const max=+$("pool").value,n=+$("count").value,ids=[];while(ids.length<n){const x=1+Math.floor(Math.random()*max);if(!ids.includes(x))ids.push(x)}const data=await Promise.all(ids.map(x=>fetch("https://pokeapi.co/api/v2/pokemon/"+x).then(r=>{if(!r.ok)throw Error("PokeAPI");return r.json()})));const mons=data.map(p=>({id:p.id,name:p.name.charAt(0).toUpperCase()+p.name.slice(1),sprite:p.sprites.other["official-artwork"].front_default||p.sprites.front_default||""}));await set(ref(db,"rooms/"+session.room+"/box"),{created:Date.now(),mons});$("genStatus").textContent="Box synchronisée pour tous les joueurs."}catch(e){$("genStatus").textContent="Erreur de génération : "+e.message}};
async function leave(removeSelf=true){if(session&&removeSelf)try{await remove(ref(db,"rooms/"+session.room+"/players/"+session.id))}catch{}localStorage.removeItem("pkmn-session");session=null;if(unsubRoom){unsubRoom();unsubRoom=null}$("room").classList.add("hidden");$("home").classList.remove("hidden");}$("leaveBtn").onclick=()=>leave();
const old=JSON.parse(localStorage.getItem("pkmn-session")||"null");if(old?.room&&old?.id){get(ref(db,"rooms/"+old.room)).then(s=>s.exists()?enter(old):localStorage.removeItem("pkmn-session")).catch(()=>localStorage.removeItem("pkmn-session"))}
</script></body></html>
